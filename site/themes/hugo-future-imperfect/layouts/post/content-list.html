<article class="post">
  {{ .Render "header" }}
  {{ .Render "featured" }}
  {{ $summary := (delimit (findRE "<p.*?>(.|\n)*?</p>" .Content 1) "") | safeHTML | truncate (default 500 .Site.Params.summary_length) ((default "&hellip;" .Site.Params.text.truncated) | safeHTML) }}
  {{ $summary }}
  <footer>
    <ul class="actions">
      <li><a href="{{ .RelPermalink }}" class="button big">Continue Reading</a></li>
    </ul>
  {{ .Render "footer-category" }}
  </footer>
</article>
